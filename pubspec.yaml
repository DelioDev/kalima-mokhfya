name: word_create
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.5+1
  audioplayers: ^5.2.1
  flutter_tts: ^4.0.2
  shared_preferences: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  win32: ^5.5.1
  path_provider_android: 2.2.23
  shared_preferences_android: 2.2.4

flutter:
  uses-material-design: true

  assets:
    - lib/data/levels/ar/
    - lib/data/levels/fr/
    - lib/data/levels/en/
    - assets/sounds/
